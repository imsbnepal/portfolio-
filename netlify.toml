[build]
  command = "npm run build"
  publish = "out"

[env]
  NEXT_PUBLIC_FORMSPREE_ID = "set_in_netlify_ui"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"
  publish = "out"

[context.preview]
  command = "npm run build"
  publish = "out"

[context.deploy-preview]
  command = "npm run build"
  publish = "out"

# Cache rules
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
